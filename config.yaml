# Configuration for data loading and the legacy v1 analyst + momentum strategy / backtests.
# The live RSI(2) strategy's parameters live in state/account.json and agent/live_rsi2.py.

# ---- Universe ----
# sp500_pit     : point-in-time S&P 500 members; each day only that day's members trade (recommended)
# sp500_current : today's S&P 500 members (survivorship-biased, comparison only)
# list          : the `universe` list below
universe_mode: sp500_pit

# Used when universe_mode = list. A hand-picked list of today's winners makes backtests very optimistic.
universe:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - AVGO
  - TSLA
  - AMD
  - NFLX
  - CRM
  - ORCL
  - ADBE
  - QCOM
  - TXN
  - INTU
  - AMAT
  - MU
  - LRCX
  - KLAC
  - PANW
  - CRWD
  - NOW
  - UBER
  - SHOP
  - JPM
  - GS
  - MS
  - V
  - MA
  - LLY
  - UNH
  - ABBV
  - MRK
  - ISRG
  - COST
  - WMT
  - HD
  - MCD
  - NKE
  - CAT
  - DE
  - GE
  - BA
  - XOM
  - CVX

benchmark: SPY

data:
  start: "2018-01-01"          # one extra year of history for the 200-day SMA
  cache_dir: data
  workers: 8

backtest:
  start: "2019-01-01"
  split: "2024-01-01"          # out-of-sample start

# ---- Signals (legacy v1) ----
signals:
  scoring: v2                   # v1: any target raise scores; v2: only rating changes and >=10% target moves
  pt_min_change: 0.10
  analyst_lookback_days: 5      # analyst events counted over the last N trading days
  min_analyst_score: 2          # minimum analyst score
  rsi_max: 75                   # overbought filter
  mom_lookback: 63              # ~3-month momentum
  market_filter: true           # no new entries while the benchmark is below its 200-day SMA

# ---- Entry / exit (legacy v1) ----
trade:
  entry_atr_mult: 0.25          # limit = prior close - 0.25 * ATR (wait for a small pullback)
  stop_atr_mult: 2.0            # stop = fill - 2 * ATR
  target_atr_mult: 3.0          # target = fill + 3 * ATR
  max_hold_days: 15             # time stop
  breakeven_at_r: 1.0           # move the stop to entry after a 1R gain

# ---- Sizing / risk (legacy v1) ----
risk:
  initial_equity: 100000
  risk_per_trade: 0.01          # max loss per trade: 1% of equity
  max_position_pct: 0.10        # max 10% of equity per position
  max_positions: 8
  slippage_bps: 5               # one-way slippage
  commission_per_order: 1.0     # commission per order (USD); set to your broker's actual fee
